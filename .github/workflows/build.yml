name: Build Dream Journal APK

# The foss flavour is deliberate: it excludes Play Services, Drive and Google
# Sign-In. Those depend on OAuth client IDs registered against a specific
# package name + signing certificate, so they would break under our renamed
# applicationId anyway — and google-services.json is not in the repo.
on:
  push:
    branches: [master, dream-journal]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # app/build.gradle.kts targets JavaVersion.VERSION_18, so 17 is too old.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts loads local.properties unconditionally at configure
      # time and reads storeFile / storePassword from it. Without this the build
      # fails before it compiles anything.
      - name: Restore keystore and local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — see CLAUDE.md for setup."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dream-journal.p12"
          # storeFile is resolved relative to the app module, so use an absolute path.
          {
            echo "storeFile=$RUNNER_TEMP/dream-journal.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
          } > local.properties

      - name: Build foss release APK
        run: ./gradlew assembleFossRelease --no-daemon --stacktrace

      - name: Verify the APK identity
        run: |
          APK=$(find app/build/outputs/apk/foss/release -name '*.apk' | head -1)
          echo "Built: $APK"
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$APK" \
            | grep -E "^package|application-label:" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dream-journal-apk
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      # local.properties is gitignored, but the keystore is not — make sure a
      # failed run can never leave it behind in the workspace.
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/dream-journal.p12" local.properties
